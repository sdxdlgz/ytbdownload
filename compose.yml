services:
  app:
    image: signal-ytdlp-web:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DENO_VERSION: ${DENO_VERSION:-2.9.6}
        APP_VERSION: ${APP_VERSION:-1.0.0}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      YTDLP_WEB_DATA_DIR: /data
      YTDLP_WEB_HOST: 0.0.0.0
      YTDLP_WEB_PORT: "8000"
      YTDLP_WEB_JS_RUNTIME: deno
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8000}:8000"
    volumes:
      - signal-data:/data
      # Optional authenticated-site support (read-only):
      # - ./secrets/cookies.txt:/run/secrets/cookies.txt:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: ${MEMORY_LIMIT:-2g}
    cpus: ${CPU_LIMIT:-2.0}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=5).read()"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 25s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  signal-data: {}
