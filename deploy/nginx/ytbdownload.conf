# Installed into /etc/nginx/sites-available/ytbdownload by scripts/install-debian.sh.
# Start with HTTP, then let Certbot add TLS and the HTTP->HTTPS redirect.

limit_req_zone $binary_remote_addr zone=signal_api:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name @@DOMAIN@@;

    server_tokens off;
    client_max_body_size 64k;

    # The API authorizes each artifact, then Nginx serves it with sendfile.
    location ^~ /_protected_downloads/ {
        internal;
        alias @@INSTALL_DIR@@/data/artifacts/;
        sendfile on;
        aio threads;
        directio 8m;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "private, no-store" always;
    }

    location ^~ /api/ {
        limit_req zone=signal_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite client-supplied XFF so in-app rate limiting cannot be spoofed.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }

    location ^~ /static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Filenames are stable, so always revalidate after deployments.
        expires -1;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 180s;
    }

    access_log /var/log/nginx/ytbdownload.access.log;
    error_log /var/log/nginx/ytbdownload.error.log warn;
}
